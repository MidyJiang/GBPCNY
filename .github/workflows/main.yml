name: Main Workflow No.1(Run & Upload)

# Successor runs use workflow_dispatch, which is allowed with GITHUB_TOKEN.
# The old periodic collection schedule is replaced by a separate watchdog.
on:
  push:
    branches: [main]
    paths:
      - main.py
      - req.txt
      - .github/workflows/main.yml
      - .github/workflows/relay-watchdog.yml
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: "Exact preceding collector run containing Formal Art"
        required: false
        type: string
      smoke_test:
        description: "One-minute test only; do not dispatch successor"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

# Never allow two collector jobs to modify independent copies of the data.
concurrency:
  group: gbpcny-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore exact predecessor checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: Formal Art
          path: Formal Art
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.previous_run_id }}

      - name: Restore latest available checkpoint after push or recovery
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.previous_run_id == '') }}
        uses: dawidd6/action-download-artifact@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: main.yml
          branch: main
          workflow_conclusion: ""
          search_artifacts: true
          name: Formal Art
          path: Formal Art
          if_no_artifact_found: fail

      - name: Normalize and validate checkpoint filename
        run: |
          set -euo pipefail
          # Uploaded artifact keeps the original uppercase SEND.csv filename.
          # The Python loader deliberately reads lowercase Formal Art/send.csv.
          if [ -s 'Formal Art/SEND.csv' ]; then
            mv 'Formal Art/SEND.csv' 'Formal Art/send.csv'
          fi
          if [ ! -s 'Formal Art/send.csv' ]; then
            echo "::error::Missing CSV in downloaded Formal Art artifact"
            find 'Formal Art' -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Recovered CSV:"
          wc -c 'Formal Art/send.csv'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: python -m pip install -r req.txt

      - name: Audit historical restore before collecting
        run: |
          python - <<'PY'
          from history_loader import load_historical_data
          data, latest = load_historical_data()
          assert len(data) >= 82088, "2023 history missing"
          assert latest > 0, "latest rate invalid"
          print("Historical bootstrap validated:", len(data), "records")
          PY

      - name: Collect GBP/CNY and send existing email reminders
        env:
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          GBPCNY_RUN_SECONDS: ${{ inputs.smoke_test && '60' || '20000' }}
        run: |
          if [ -z "$QQ_MAIL_AUTH_CODE" ]; then
            echo "::error::Missing QQ_MAIL_AUTH_CODE repository secret"
            exit 1
          fi
          python -u main.py

      - name: Verify output CSV
        run: test -s SEND.csv

      # Salvage a checkpoint even when subsequent processing fails.
      - name: Upload Formal Art
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Formal Art
          path: SEND.csv
          if-no-files-found: warn
          retention-days: 30

      # This runs only after the CSV artifact was uploaded successfully.
      # The successor remains queued until this job releases the concurrency lock.
      - name: Start next collector run
        if: ${{ success() && !inputs.smoke_test }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run main.yml --ref main -f previous_run_id="$PREVIOUS_RUN_ID"
          echo "Dispatched next collector using checkpoint from run $PREVIOUS_RUN_ID"
