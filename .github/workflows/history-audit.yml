name: Verify 2023 history restoration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/history-audit.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout restored GBPCNY history
        uses: actions/checkout@v4

      - name: Download latest successful GBPCNY CSV
        uses: dawidd6/action-download-artifact@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: main.yml
          branch: main
          workflow_conclusion: success
          search_artifacts: true
          name: Formal Art
          path: Formal Art
          if_no_artifact_found: fail

      - name: Install Python and pandas
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install test dependency
        run: python -m pip install pandas==2.0.3

      - name: Verify actual merged history
        run: |
          python - <<'PY'
          import pandas as pd
          from history_loader import load_historical_data
          merged, latest_price = load_historical_data()
          dates = pd.to_datetime(merged['发布日期'])
          assert dates.min() == pd.Timestamp('2023-08-01 09:12:36')
          assert len(merged) > 82088
          assert latest_price > 0
          assert not dates.duplicated().any()
          assert dates.is_monotonic_increasing
          print('HISTORY_MERGE_OK rows={} earliest={} latest={} latest_rate={}'.format(
              len(merged), dates.min(), dates.max(), latest_price))
          PY
